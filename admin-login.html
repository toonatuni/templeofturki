<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Admin Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        nav {
            background: #8B0000;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .login-box {
            background: white;
            width: 400px;
            max-width: 90%;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-box h2 {
            color: #8B0000;
            margin-bottom: 25px;
        }

        .login-box input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #8B0000;
            color: white;
            font-size: 16px;
        }

        .login-box button:hover {
            background: #b22222;
        }

        .google-btn {
            background: #4285F4 !important;
        }

        .google-btn:hover {
            background: #3367d6 !important;
        }

        .divider {
            margin: 20px 0;
            color: #777;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <nav>
        <h2>TOT - Temple of Turki</h2>
    </nav>

    <div class="login-container">

        <div class="login-box">

            <h2>Admin Login</h2>

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                autocomplete="current-password"
            >

            <button id="loginButton">
                Login
            </button>

            <div class="divider">
                OR
            </div>

            <button
                id="googleLoginButton"
                class="google-btn">
                Login with Google
            </button>

            <div
                id="loginMessage"
                class="message">
            </div>

        </div>

    </div>


    <!-- FIREBASE LOGIN -->

    <script type="module">

        import { auth } from "./firebase.js";

        import {
            signInWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        // ==========================================
        // EMAIL / PASSWORD LOGIN
        // ==========================================

        document
            .getElementById("loginButton")
            .addEventListener("click", async function () {

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;

                const message =
                    document.getElementById("loginMessage");


                if (!email) {

                    message.textContent =
                        "Please enter your email.";

                    return;
                }


                if (!password) {

                    message.textContent =
                        "Please enter your password.";

                    return;
                }


                try {

                    message.textContent =
                        "Logging in...";


                    const userCredential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    console.log(
                        "Login successful:",
                        userCredential.user
                    );


                    message.textContent =
                        "Login successful. Redirecting...";


                    window.location.href =
                        "admin-dashboard.html";


                } catch (error) {

                    console.error(
                        "Email Login Error:",
                        error
                    );


                    message.textContent =
                        "Login failed: " +
                        error.message;

                }

            });


        // ==========================================
        // GOOGLE LOGIN
        // ==========================================

        const provider =
            new GoogleAuthProvider();


        document
            .getElementById("googleLoginButton")
            .addEventListener("click", async function () {

                const message =
                    document.getElementById(
                        "loginMessage"
                    );


                try {

                    message.textContent =
                        "Opening Google Login...";


                    const result =
                        await signInWithPopup(
                            auth,
                            provider
                        );


                    console.log(
                        "Google Login successful:",
                        result.user
                    );


                    message.textContent =
                        "Google login successful. Redirecting...";


                    window.location.href =
                        "admin-dashboard.html";


                } catch (error) {

                    console.error(
                        "Google Login Error:",
                        error
                    );


                    message.textContent =
                        "Google Login failed: " +
                        error.message;

                }

            });

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Admin Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f4f4f4;
        }

        nav{
            background:#8B0000;
            color:white;
            padding:20px;
            text-align:center;
        }

        .login-container{
            display:flex;
            justify-content:center;
            align-items:center;
            height:80vh;
        }

        .login-box{
            background:white;
            width:400px;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        .login-box h2{
            color:#8B0000;
        }

        .login-box input{
            width:90%;
            padding:12px;
            margin-top:10px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        .login-box button{
            width:95%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            background:#8B0000;
            color:white;
            font-size:16px;
        }

        .login-box button:hover{
            background:#b22222;
        }

    </style>

</head>

<body>

<nav>

    <h2>🛕 Jai Baba Dihbar Temple</h2>

</nav>

<div class="login-container">

    <div class="login-box">

        <h2>Admin Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Enter Email">

        <br>

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <br>

        <button onclick="login()">
            Login
        </button>

        <button onclick="googleLogin()">
            Login with Google
        </button>

    </div>

</div>

<script type="module">

import { auth } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

window.login = function () {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    signInWithEmailAndPassword(
        auth,
        email,
        password
    )

    .then(() => {

        alert("Login Successful");

        window.location.href = "index.html";

    })

    .catch((error) => {

        alert(error.message);

    });
};

const provider = new GoogleAuthProvider();

window.googleLogin = function () {

    signInWithPopup(auth, provider)

    .then(() => {

        alert("Google Login Successful");

        window.location.href = "index.html";

    })

    .catch((error) => {

        alert(error.message);

    });
};

</script>

</body>
</html>

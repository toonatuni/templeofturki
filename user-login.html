<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Temple User Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        nav {
            background: #8B0000;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav h2 {
            margin: 0;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .login-box {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-box h2 {
            color: #8B0000;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 90%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .login-box button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #8B0000;
            color: white;
            font-size: 16px;
        }

        .login-box button:hover {
            background: #b22222;
        }

        .google-button {
            background: #b22222 !important;
        }

        .google-button:hover {
            background: #8B0000 !important;
        }

        .login-message {
            margin-top: 15px;
            color: #8B0000;
            font-size: 14px;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: #8B0000;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<!-- HEADER -->

<nav>

    <h2>
        TOT - Temple of Turki
    </h2>

</nav>


<!-- LOGIN -->

<div class="login-container">

    <div class="login-box">

        <h2>
            User Login
        </h2>


        <!-- EMAIL -->

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required>


        <!-- PASSWORD -->

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required>


        <!-- LOGIN BUTTON -->

        <button
            type="button"
            id="loginButton">

            Login

        </button>


        <!-- GOOGLE LOGIN -->

        <button
            type="button"
            id="googleLoginButton"
            class="google-button">

            Login with Google

        </button>


        <!-- MESSAGE -->

        <p
            id="loginMessage"
            class="login-message">
        </p>


        <!-- BACK HOME -->

        <a
            href="index.html"
            class="back-home">

            ← Back to Home

        </a>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

    import { auth } from "./firebase.js";

    import {
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        signInWithRedirect
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const googleLoginButton = document.getElementById("googleLoginButton");
    const loginMessage = document.getElementById("loginMessage");

    if (!emailInput || !passwordInput || !loginButton || !googleLoginButton || !loginMessage) {
        console.error("User login form elements are missing.");
    } else {
        const handleEmailLogin = async function () {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                loginMessage.textContent = "Please enter email and password.";
                return;
            }

            loginMessage.textContent = "Logging in...";
            loginButton.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginMessage.textContent = "Login Successful!";
                window.location.href = "index.html";
            } catch (error) {
                console.error("Email Login Error:", error);
                loginMessage.textContent = getErrorMessage(error);
                loginButton.disabled = false;
            }
        };

        loginButton.addEventListener("click", handleEmailLogin);

        const provider = new GoogleAuthProvider();

        googleLoginButton.addEventListener("click", async function () {
            loginMessage.textContent = "Opening Google Login...";
            googleLoginButton.disabled = true;

            try {
                await signInWithPopup(auth, provider);
                loginMessage.textContent = "Google Login Successful!";
                window.location.href = "index.html";
            } catch (error) {
                console.error("Google Login Error:", error);

                if (error.code === "auth/popup-blocked" || error.code === "auth/cancelled-popup-request") {
                    loginMessage.textContent = "Popup was blocked. Redirecting to Google login...";
                    try {
                        await signInWithRedirect(auth, provider);
                        return;
                    } catch (redirectError) {
                        console.error("Google Redirect Login Error:", redirectError);
                        loginMessage.textContent = getErrorMessage(redirectError);
                    }
                } else {
                    loginMessage.textContent = getErrorMessage(error);
                }

                googleLoginButton.disabled = false;
            }
        });
    }

    // ==============================
    // FIREBASE ERROR MESSAGE
    // ==============================
    function getErrorMessage(error) {

        switch (error.code) {

            case "auth/invalid-credential":
                return "Invalid email or password.";

            case "auth/user-not-found":
                return "User account not found.";

            case "auth/wrong-password":
                return "Incorrect password.";

            case "auth/invalid-email":
                return "Please enter a valid email.";

            case "auth/popup-closed-by-user":
                return "Google login was cancelled. Please try again.";

            case "auth/cancelled-popup-request":
                return "Google login popup was cancelled. Please try again.";

            case "auth/popup-blocked":
                return "Popup was blocked. Please allow popups or click again.";

            case "auth/unauthorized-domain":
                return "This website domain is not authorized in Firebase. Add localhost and your hosted domain in Firebase Auth settings.";

            default:
                return error.message;
        }

    }

</script>


</body>

</html>

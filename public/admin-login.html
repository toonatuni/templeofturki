<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login | Temple of Turki
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================================
           ADMIN LOGIN PAGE
        ========================================= */

        body {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            background:
                linear-gradient(
                    135deg,
                    var(--orange-light),
                    var(--cream)
                );

        }


        /* =========================================
           HEADER
        ========================================= */

        .admin-header {

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-dark),
                    var(--maroon)
                );

            color: white;

            padding: 18px 20px;

            box-shadow:
                0 5px 20px
                rgba(79, 22, 15, 0.18);

        }


        .admin-header-content {

            width:
                min(1180px, calc(100% - 40px));

            margin: 0 auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .admin-logo {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .admin-logo-icon {

            width: 45px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background: var(--orange);

            font-size: 24px;

        }


        .admin-logo-text h2 {

            font-size: 1.2rem;

            margin: 0;

        }


        .admin-logo-text p {

            margin: 2px 0 0;

            font-size: 0.78rem;

            opacity: 0.75;

        }


        .home-link {

            padding: 10px 16px;

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 0.9rem;

            font-weight: 700;

        }


        .home-link:hover {

            background: var(--orange);

        }


        /* =========================================
           LOGIN AREA
        ========================================= */

        .admin-login-wrapper {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 50px 20px;

        }


        .admin-login-card {

            width: 100%;

            max-width: 450px;

            background: var(--white);

            border:
                1px solid var(--border);

            border-radius: 24px;

            padding: 40px;

            box-shadow:
                var(--shadow-large);

        }


        .login-top {

            text-align: center;

            margin-bottom: 30px;

        }


        .login-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            background:
                var(--orange-light);

            font-size: 35px;

        }


        .login-top h1 {

            color: var(--maroon);

            font-size: 1.9rem;

            margin-bottom: 8px;

        }


        .login-top p {

            color: var(--muted);

            font-size: 0.9rem;

        }


        /* =========================================
           FORM
        ========================================= */

        .login-form-group {

            margin-bottom: 18px;

        }


        .login-form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 0.88rem;

            font-weight: 700;

            color: var(--text);

        }


        .login-form-group input {

            width: 100%;

            padding: 14px 15px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background: var(--cream);

            color: var(--text);

            outline: none;

            transition: 0.2s;

        }


        .login-form-group input:focus {

            border-color: var(--orange);

            box-shadow:
                0 0 0 3px
                rgba(244, 123, 32, 0.15);

        }


        /* =========================================
           BUTTONS
        ========================================= */

        .signin-button {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 12px;

            cursor: pointer;

            background:
                var(--orange);

            color: white;

            font-size: 1rem;

            font-weight: 800;

            margin-top: 5px;

            transition: 0.2s;

        }


        .signin-button:hover {

            background:
                var(--orange-dark);

            transform:
                translateY(-1px);

        }


        .signin-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* =========================================
           DIVIDER
        ========================================= */

        .login-divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0;

            color: var(--muted);

            font-size: 0.85rem;

        }


        .login-divider::before,

        .login-divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                var(--border);

        }


        /* =========================================
           GOOGLE BUTTON
        ========================================= */

        .google-button {

            width: 100%;

            border:
                1px solid var(--border);

            padding: 14px;

            border-radius: 12px;

            cursor: pointer;

            background:
                var(--white);

            color:
                var(--text);

            font-size: 0.95rem;

            font-weight: 700;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            transition: 0.2s;

        }


        .google-button:hover {

            border-color:
                var(--orange);

            background:
                var(--orange-light);

        }


        .google-icon {

            font-size: 20px;

        }


        /* =========================================
           MESSAGE
        ========================================= */

        .login-message {

            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 0.88rem;

            min-height: 20px;

        }


        .login-message.success {

            background:
                rgba(22, 140, 66, 0.12);

            color:
                #168c42;

        }


        .login-message.error {

            background:
                rgba(220, 53, 69, 0.10);

            color:
                #c82333;

        }


        .login-message.loading {

            background:
                var(--orange-light);

            color:
                var(--maroon);

        }


        /* =========================================
           SECURITY TEXT
        ========================================= */

        .security-note {

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid var(--border);

            text-align: center;

            color: var(--muted);

            font-size: 0.78rem;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .admin-header-content {

                width: 100%;

            }


            .admin-login-card {

                padding: 28px 20px;

            }


            .admin-logo-text h2 {

                font-size: 1rem;

            }


            .home-link {

                padding: 8px 11px;

                font-size: 0.8rem;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="admin-header">

        <div class="admin-header-content">

            <div class="admin-logo">

                <div class="admin-logo-icon">

                    T

                </div>


                <div class="admin-logo-text">

                    <h2>
                        Temple of Turki
                    </h2>

                    <p>
                        Secure Admin Portal
                    </p>

                </div>

            </div>


            <a
                href="index.html"
                class="home-link"
            >

                ← Home

            </a>

        </div>

    </header>



    <!-- =========================================
         LOGIN
    ========================================= -->

    <main class="admin-login-wrapper">


        <div class="admin-login-card">


            <div class="login-top">

                <div class="login-icon">

                    T

                </div>


                <h1>

                    Admin Sign In

                </h1>


                <p>

                    Sign in with your authorized
                    Temple of Turki admin account.

                </p>

            </div>



            <!-- EMAIL LOGIN -->

            <div class="login-form-group">

                <label>

                    Email Address

                </label>


                <input

                    type="email"

                    id="email"

                    placeholder="Enter admin email"

                    autocomplete="email"

                >

            </div>



            <div class="login-form-group">

                <label>

                    Password

                </label>


                <input

                    type="password"

                    id="password"

                    placeholder="Enter password"

                    autocomplete="current-password"

                >

            </div>



            <button
                id="loginButton"
                class="signin-button"
            >

                Sign In

            </button>



            <!-- DIVIDER -->

            <div class="login-divider">

                OR

            </div>



            <!-- GOOGLE LOGIN -->

            <button
                id="googleLoginButton"
                class="google-button"
            >

                <span class="google-icon">

                    G

                </span>


                Continue with Google

            </button>



            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="login-message"
            >

            </div>



            <div class="security-note">

                Only authorized administrators
                can access the dashboard.

            </div>


        </div>


    </main>



    <!-- =========================================
         FIREBASE AUTH
    ========================================= -->

    <script type="module">


        import { auth }
        from "./firebase.js";


        import {

            signInWithEmailAndPassword,

            GoogleAuthProvider,

            signInWithPopup,

            signOut

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



        /* =========================================
           IMPORTANT

           Add your admin email or Firebase UID.

           The backend also checks ADMIN_UIDS from .env,
           so a UID works too.
        ========================================= */

        const ADMIN_EMAILS = [

           "dhirajkumar5566kl@gmail.com"

        ];

        const ADMIN_UIDS = [

           "YOUR_FIREBASE_UID_HERE"

        ];



        /* =========================================
           ELEMENTS
        ========================================= */

        const emailInput =
            document.getElementById("email");


        const passwordInput =
            document.getElementById("password");


        const loginButton =
            document.getElementById("loginButton");


        const googleLoginButton =
            document.getElementById(
                "googleLoginButton"
            );


        const message =
            document.getElementById(
                "loginMessage"
            );



        /* =========================================
           MESSAGE FUNCTION
        ========================================= */

        function showMessage(
            text,
            type = ""
        ) {

            message.textContent =
                text;


            message.className =
                "login-message " + type;

        }



        /* =========================================
           CHECK ADMIN
        ========================================= */

        function normalizeValue(
            value
        ) {

            return String(
                value || ""
            )
                .toLowerCase()
                .trim();

        }


        async function checkAdmin(
            user
        ) {

            if (!user) {

                return false;

            }


            const email =
                normalizeValue(
                    user.email
                );

            const uid =
                normalizeValue(
                    user.uid
                );


            const allowedEmails =
                ADMIN_EMAILS.map(
                    normalizeValue
                );

            const allowedUids =
                ADMIN_UIDS.map(
                    normalizeValue
                );


            return (
                allowedEmails.includes(
                    email
                ) ||
                allowedUids.includes(
                    uid
                )
            );

        }



        /* =========================================
           EMAIL LOGIN
        ========================================= */

        loginButton
            .addEventListener(

                "click",

                async function () {


                    const email =
                        emailInput
                            .value
                            .trim();


                    const password =
                        passwordInput
                            .value;


                    if (!email) {

                        showMessage(
                            "Please enter your admin email.",
                            "error"
                        );

                        return;

                    }


                    if (!password) {

                        showMessage(
                            "Please enter your password.",
                            "error"
                        );

                        return;

                    }


                    try {


                        loginButton.disabled =
                            true;


                        showMessage(
                            "Signing in...",
                            "loading"
                        );


                        const result =
                            await
                            signInWithEmailAndPassword(

                                auth,

                                email,

                                password

                            );


                        const isAdmin =
                            await
                            checkAdmin(
                                result.user
                            );


                        if (!isAdmin) {


                            await
                            signOut(
                                auth
                            );


                            showMessage(

                                "Access denied. This email is not authorized as an admin.",

                                "error"

                            );


                            loginButton.disabled =
                                false;


                            return;

                        }


                        showMessage(

                            "Login successful. Redirecting...",

                            "success"

                        );


                        window.location.href =
                            "admin-dashboard.html";


                    }

                    catch (error) {


                        console.error(
                            error
                        );


                        showMessage(

                            "Login failed: " +
                            error.message,

                            "error"

                        );


                        loginButton.disabled =
                            false;

                    }


                }

            );



        /* =========================================
           GOOGLE LOGIN
        ========================================= */

        const provider =
            new GoogleAuthProvider();



        googleLoginButton
            .addEventListener(

                "click",

                async function () {


                    try {


                        googleLoginButton.disabled =
                            true;


                        showMessage(

                            "Opening Google Sign In...",

                            "loading"

                        );


                        const result =
                            await
                            signInWithPopup(

                                auth,

                                provider

                            );


                        const isAdmin =
                            await
                            checkAdmin(
                                result.user
                            );


                        if (!isAdmin) {


                            await
                            signOut(
                                auth
                            );


                            showMessage(

                                "Access denied. This Google account is not authorized as an admin.",

                                "error"

                            );


                            googleLoginButton.disabled =
                                false;


                            return;

                        }


                        showMessage(

                            "Google login successful. Redirecting...",

                            "success"

                        );


                        window.location.href =
                            "admin-dashboard.html";


                    }

                    catch (error) {


                        console.error(
                            error
                        );


                        showMessage(

                            "Google login failed: " +
                            error.message,

                            "error"

                        );


                        googleLoginButton.disabled =
                            false;

                    }


                }

            );


    </script>


</body>

</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f160f">
    <title>Admin Dashboard | Temple of Turki</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --admin-sidebar: #4f160f;
            --admin-sidebar-soft: #68231b;
            --admin-page: #f8f5f1;
            --admin-card: #fff;
            --admin-line: #eadbd0;
            --admin-muted: #786c65;
            --admin-text: #29211d;
            --admin-radius: 16px;
            --admin-shadow: 0 8px 25px rgba(85, 43, 20, .07);
        }

        body.admin-app { min-height: 100vh; background: var(--admin-page); color: var(--admin-text); }
        .admin-app svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .admin-shell { min-height: 100vh; }
        .admin-sidebar {
            position: fixed; inset: 0 auto 0 0; z-index: 50; display: flex; width: 252px;
            flex-direction: column; padding: 24px 16px 18px; overflow-y: auto;
            background: var(--admin-sidebar); color: #fff;
        }
        .admin-brand { display: flex; align-items: center; gap: 12px; padding: 3px 10px 27px; }
        .admin-brand-mark {
            display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px;
            background: var(--orange); color: var(--maroon-dark);
        }
        .admin-brand-mark svg { width: 25px; height: 25px; }
        .admin-brand strong { display: block; font-size: 1.12rem; letter-spacing: .04em; }
        .admin-brand span { color: rgba(255,255,255,.65); font-size: .74rem; }
        .admin-nav-label { padding: 10px 12px 8px; color: rgba(255,255,255,.52); font-size: .68rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
        .admin-nav { display: grid; gap: 5px; }
        .admin-nav button, .admin-sidebar-footer button {
            display: flex; width: 100%; align-items: center; gap: 12px; min-height: 43px; padding: 10px 12px;
            border: 0; border-radius: 10px; background: transparent; color: rgba(255,255,255,.78);
            cursor: pointer; text-align: left; font: inherit; font-size: .88rem; transition: .16s ease;
        }
        .admin-nav button:hover, .admin-sidebar-footer button:hover { background: rgba(255,255,255,.09); color: white; }
        .admin-nav button[aria-current="page"] { background: var(--orange); color: var(--maroon-dark); font-weight: 800; }
        .admin-nav svg, .admin-sidebar-footer svg { width: 18px; height: 18px; flex: 0 0 auto; }
        .admin-sidebar-footer { margin-top: auto; padding-top: 20px; }
        .admin-sidebar-footer .admin-account { padding: 14px 12px 10px; border-top: 1px solid rgba(255,255,255,.12); }
        .admin-account strong { display: block; overflow: hidden; color: #fff; font-size: .8rem; text-overflow: ellipsis; white-space: nowrap; }
        .admin-account span { color: rgba(255,255,255,.6); font-size: .72rem; }
        .admin-main { min-height: 100vh; margin-left: 252px; }
        .admin-topbar {
            position: sticky; top: 0; z-index: 30; display: flex; min-height: 76px; align-items: center;
            justify-content: space-between; gap: 18px; padding: 12px clamp(18px, 3vw, 38px);
            border-bottom: 1px solid var(--admin-line); background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
        }
        .admin-topbar-title { display: flex; align-items: center; gap: 14px; }
        .admin-topbar h1 { margin: 0; color: var(--maroon-dark); font-size: 1.18rem; }
        .admin-topbar p { margin: 3px 0 0; color: var(--admin-muted); font-size: .78rem; }
        .admin-mobile-menu {
            display: none; width: 40px; height: 40px; place-items: center; border: 1px solid var(--admin-line);
            border-radius: 10px; background: #fff; color: var(--maroon); cursor: pointer;
        }
        .admin-mobile-menu svg { width: 20px; height: 20px; }
        .admin-topbar-user { display: flex; align-items: center; gap: 10px; color: var(--admin-muted); font-size: .82rem; }
        .admin-avatar {
            display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%;
            background: var(--orange-light); color: var(--maroon); font-weight: 800;
        }
        .admin-content { width: min(1440px, 100%); margin: 0 auto; padding: 30px clamp(18px, 3vw, 38px) 52px; }
        .admin-page-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
        .admin-page-heading h2 { margin: 0; color: var(--maroon-dark); font-size: clamp(1.45rem, 2.5vw, 1.9rem); }
        .admin-page-heading p { margin: 5px 0 0; color: var(--admin-muted); font-size: .88rem; }
        .admin-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 15px; margin-bottom: 20px; }
        .admin-stat, .admin-panel {
            min-width: 0; border: 1px solid var(--admin-line); border-radius: var(--admin-radius);
            background: var(--admin-card); box-shadow: var(--admin-shadow);
        }
        .admin-stat { display: flex; min-height: 122px; align-items: center; justify-content: space-between; gap: 14px; padding: 19px; }
        .admin-stat-label { color: var(--admin-muted); font-size: .78rem; font-weight: 700; }
        .admin-stat-value { margin-top: 8px; color: var(--maroon-dark); font-size: clamp(1.35rem, 2vw, 1.8rem); font-weight: 850; line-height: 1.15; overflow-wrap: anywhere; }
        .admin-stat-icon { display: grid; width: 43px; height: 43px; flex: 0 0 auto; place-items: center; border-radius: 13px; background: var(--orange-light); color: var(--maroon); }
        .admin-stat-icon svg { width: 21px; height: 21px; }
        .admin-grid-two { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(260px,.8fr); gap: 18px; margin-bottom: 18px; }
        .admin-panel { overflow: hidden; }
        .admin-panel-head { display: flex; min-height: 62px; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--admin-line); }
        .admin-panel-head h3 { margin: 0; color: var(--maroon-dark); font-size: .98rem; }
        .admin-panel-body { padding: 18px; }
        .admin-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .admin-field, .admin-select, .admin-textarea {
            min-height: 40px; padding: 9px 11px; border: 1px solid var(--admin-line); border-radius: 9px;
            background: #fff; color: var(--admin-text); font: inherit; font-size: .84rem;
        }
        .admin-field:focus, .admin-select:focus, .admin-textarea:focus { outline: 2px solid rgba(244,123,32,.28); border-color: var(--orange); }
        .admin-field[type="search"] { min-width: min(280px,100%); }
        .admin-textarea { width: 100%; min-height: 100px; resize: vertical; }
        .admin-button {
            display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 7px;
            padding: 8px 12px; border: 1px solid transparent; border-radius: 9px; background: var(--maroon);
            color: #fff; cursor: pointer; font: inherit; font-size: .8rem; font-weight: 750; text-decoration: none;
        }
        .admin-button:hover { background: var(--maroon-dark); }
        .admin-button svg { width: 16px; height: 16px; }
        .admin-button.secondary { border-color: var(--admin-line); background: #fff; color: var(--maroon); }
        .admin-button.secondary:hover { background: var(--orange-light); }
        .admin-button.accent { background: var(--orange); color: var(--maroon-dark); }
        .admin-button.danger { border-color: #f0c8c2; background: #fff6f4; color: #9d3023; }
        .admin-button.danger:hover { background: #fce8e4; }
        .admin-button:disabled { cursor: not-allowed; opacity: .55; }
        .admin-table-wrap { width: 100%; overflow-x: auto; }
        .admin-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        .admin-table th { padding: 11px 14px; background: #fbf8f5; color: var(--admin-muted); font-size: .7rem; font-weight: 800; letter-spacing: .04em; text-align: left; text-transform: uppercase; }
        .admin-table td { padding: 12px 14px; border-top: 1px solid #f0e8e2; color: var(--admin-text); font-size: .8rem; vertical-align: middle; }
        .admin-table tr:hover td { background: #fffdfa; }
        .admin-subtext { display: block; max-width: 230px; margin-top: 3px; overflow: hidden; color: var(--admin-muted); font-size: .72rem; text-overflow: ellipsis; }
        .admin-actions { display: flex; flex-wrap: wrap; gap: 6px; }
        .admin-actions .admin-button { min-height: 31px; padding: 5px 8px; font-size: .73rem; }
        .admin-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; background: var(--orange-light); color: var(--maroon); font-size: .68rem; font-weight: 800; text-transform: capitalize; }
        .admin-badge.success { background: #edf6ee; color: #27643a; }
        .admin-badge.error { background: #fceceb; color: #982d25; }
        .admin-badge.neutral { background: #f1efed; color: #655b54; }
        .admin-empty, .admin-loading, .admin-error { padding: 30px 18px; color: var(--admin-muted); font-size: .86rem; text-align: center; }
        .admin-error { color: #982d25; }
        .admin-pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--admin-line); color: var(--admin-muted); font-size: .78rem; }
        .admin-pagination-controls { display: flex; gap: 7px; }
        .admin-announcement-form { display: grid; gap: 10px; padding: 18px; border-bottom: 1px solid var(--admin-line); }
        .admin-announcement-form .admin-field { width: 100%; }
        .admin-announcement { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 16px 18px; border-bottom: 1px solid #f0e8e2; }
        .admin-announcement:last-child { border-bottom: 0; }
        .admin-announcement h4 { margin: 0 0 5px; color: var(--maroon-dark); font-size: .9rem; }
        .admin-announcement p { margin: 0 0 8px; color: var(--admin-muted); font-size: .8rem; white-space: pre-wrap; }
        .admin-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(210px,1fr)); gap: 14px; }
        .admin-gallery-card { overflow: hidden; border: 1px solid var(--admin-line); border-radius: 12px; background: #fff; }
        .admin-gallery-card img { width: 100%; height: 150px; object-fit: cover; background: var(--admin-page); }
        .admin-gallery-info { display: grid; gap: 9px; padding: 12px; }
        .admin-gallery-info strong { overflow: hidden; color: var(--maroon-dark); font-size: .8rem; text-overflow: ellipsis; white-space: nowrap; }
        .admin-gallery-controls { display: flex; flex-wrap: wrap; gap: 7px; }
        .admin-gallery-controls .admin-select { min-width: 0; flex: 1; }
        .admin-details-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
        .admin-detail { padding: 11px; border: 1px solid var(--admin-line); border-radius: 9px; background: #fff; overflow-wrap: anywhere; }
        .admin-detail span { display: block; margin-bottom: 4px; color: var(--admin-muted); font-size: .68rem; font-weight: 750; text-transform: uppercase; }
        .admin-detail strong { font-size: .82rem; font-weight: 650; }
        .admin-settings-note { padding: 13px; border: 1px solid var(--admin-line); border-radius: 10px; background: #fbf8f5; color: var(--admin-muted); font-size: .82rem; line-height: 1.55; }
        .admin-overlay { position: fixed; inset: 0; z-index: 45; display: none; background: rgba(35,18,14,.48); }
        .admin-overlay.active { display: block; }
        .admin-dialog { width: min(760px,calc(100% - 28px)); max-height: min(88vh,900px); padding: 0; border: 0; border-radius: 16px; box-shadow: 0 25px 80px rgba(0,0,0,.25); }
        .admin-dialog::backdrop { background: rgba(35,18,14,.55); }
        .admin-dialog-head { position: sticky; top: 0; display: flex; justify-content: space-between; gap: 15px; padding: 17px 20px; border-bottom: 1px solid var(--admin-line); background: #fff; }
        .admin-dialog-head h2 { margin: 0; color: var(--maroon-dark); font-size: 1.1rem; }
        .admin-dialog-body { display: grid; gap: 18px; padding: 18px 20px 22px; }
        .admin-dialog-section h3 { margin: 0 0 10px; color: var(--maroon); font-size: .9rem; }
        .admin-edit-form { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
        .admin-edit-form label { display: grid; gap: 5px; color: var(--admin-muted); font-size: .74rem; font-weight: 700; }
        .admin-toast { position: fixed; right: 20px; bottom: 20px; z-index: 100; max-width: min(420px,calc(100% - 40px)); padding: 12px 16px; border-radius: 10px; background: var(--maroon-dark); color: #fff; box-shadow: var(--admin-shadow); font-size: .83rem; }
        [hidden] { display: none !important; }

        @media (max-width: 1100px) {
            .admin-stats { grid-template-columns: repeat(3,minmax(0,1fr)); }
            .admin-grid-two { grid-template-columns: 1fr; }
        }
        @media (max-width: 760px) {
            .admin-sidebar { width: 270px; transform: translateX(-102%); transition: transform .2s ease; }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; }
            .admin-mobile-menu { display: grid; }
            .admin-topbar { min-height: 66px; }
            .admin-topbar-user > span:last-child { display: none; }
            .admin-content { padding-top: 22px; }
            .admin-stats { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
            .admin-stat { min-height: 102px; padding: 14px; }
            .admin-stat-icon { width: 36px; height: 36px; }
            .admin-toolbar { align-items: stretch; }
            .admin-toolbar > * { flex: 1 1 140px; }
            .admin-field[type="search"] { min-width: 100%; }
        }
        @media (max-width: 440px) {
            .admin-page-heading { align-items: flex-start; flex-direction: column; }
            .admin-stats { grid-template-columns: 1fr 1fr; }
            .admin-stat { align-items: flex-start; flex-direction: column-reverse; gap: 10px; }
            .admin-stat-value { font-size: 1.3rem; }
            .admin-panel-head, .admin-panel-body { padding: 14px; }
            .admin-details-grid, .admin-edit-form { grid-template-columns: 1fr; }
            .admin-pagination { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body class="admin-app">
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-definitions" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
        <symbol id="i-temple" viewBox="0 0 24 24"><path d="M3 21h18M5 21V11l7-6 7 6v10M9 21v-6h6v6M3 11h18M8 11V8m8 3V8m-4-3V3"/></symbol>
        <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></symbol>
        <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
        <symbol id="i-donation" viewBox="0 0 24 24"><path d="M12 3v18M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/></symbol>
        <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="m3 11 18-5v12L3 13v-2Zm0 2 2 7h5l-2-6m13-5a4 4 0 0 1 0 8"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
        <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20M7 15h3"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1-.1 1.8Z"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
        <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5m5 5H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    </svg>

    <div class="admin-shell">
        <div id="adminOverlay" class="admin-overlay"></div>
        <aside id="adminSidebar" class="admin-sidebar" aria-label="Admin navigation">
            <a class="admin-brand" href="index.html" aria-label="Temple of Turki home">
                <span class="admin-brand-mark"><svg><use href="#i-temple"></use></svg></span>
                <span><strong>TOT</strong><span>Temple of Turki</span></span>
            </a>
            <div class="admin-nav-label">Workspace</div>
            <nav class="admin-nav">
                <button type="button" data-view="overview" aria-current="page"><svg><use href="#i-dashboard"></use></svg>Dashboard</button>
                <button type="button" data-view="users"><svg><use href="#i-users"></use></svg>Users</button>
                <button type="button" data-view="donations"><svg><use href="#i-donation"></use></svg>Donations</button>
                <button type="button" data-view="announcements"><svg><use href="#i-megaphone"></use></svg>Announcements</button>
                <button type="button" data-view="gallery"><svg><use href="#i-image"></use></svg>Gallery</button>
                <button type="button" data-view="payments"><svg><use href="#i-card"></use></svg>Payments</button>
                <button type="button" data-view="settings"><svg><use href="#i-settings"></use></svg>Settings</button>
            </nav>
            <div class="admin-sidebar-footer">
                <button type="button" data-view="profile"><svg><use href="#i-user"></use></svg>Admin Profile</button>
                <div class="admin-account"><strong id="sidebarAdminName">Loading admin</strong><span>Authorized administrator</span></div>
                <button type="button" id="sidebarLogout"><svg><use href="#i-logout"></use></svg>Logout</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <div class="admin-topbar-title">
                    <button id="mobileMenuButton" class="admin-mobile-menu" type="button" aria-label="Open admin menu" aria-expanded="false"><svg><use href="#i-menu"></use></svg></button>
                    <div><h1 id="topbarTitle">Dashboard</h1><p id="topbarSubtitle">Temple of Turki administration</p></div>
                </div>
                <div class="admin-topbar-user"><span id="topbarAdminEmail">Checking access...</span><span id="adminAvatar" class="admin-avatar" aria-hidden="true">T</span></div>
            </header>
            <div id="adminContent" class="admin-content" aria-live="polite">
                <div class="admin-loading">Verifying administrator access…</div>
            </div>
        </main>
    </div>

    <dialog id="userDialog" class="admin-dialog" aria-labelledby="userDialogTitle">
        <div class="admin-dialog-head"><h2 id="userDialogTitle">User details</h2><button type="button" class="admin-button secondary" data-close-dialog>Close</button></div>
        <div id="userDialogBody" class="admin-dialog-body"></div>
    </dialog>
    <div id="adminToast" class="admin-toast" role="status" hidden></div>
    <script type="module" src="admin-dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Dashboard | Temple of Turki
    </title>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>


        /* =========================================
           ADMIN DASHBOARD
        ========================================= */

        body {

            background:
                var(--cream);

        }


        /* =========================================
           HEADER
        ========================================= */

        .dashboard-header {

            position: sticky;

            top: 0;

            z-index: 100;

            background:
                linear-gradient(
                    135deg,
                    var(--maroon-dark),
                    var(--maroon)
                );

            color: white;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.12);

        }


        .dashboard-nav {

            width:
                min(1280px, calc(100% - 40px));

            margin: auto;

            min-height: 75px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .dashboard-brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .brand-icon {

            width: 46px;

            height: 46px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                var(--orange);

            font-size: 25px;

        }


        .dashboard-brand h1 {

            font-size: 1.15rem;

        }


        .dashboard-brand p {

            font-size: 0.75rem;

            opacity: 0.7;

        }


        .dashboard-actions {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .admin-user {

            padding: 9px 13px;

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.10);

            font-size: 0.82rem;

        }


        .logout-button {

            border: none;

            background:
                var(--orange);

            color: white;

            padding: 10px 16px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 700;

        }


        .logout-button:hover {

            background:
                var(--orange-dark);

        }


        /* =========================================
           MAIN
        ========================================= */

        .dashboard-main {

            width:
                min(1280px, calc(100% - 40px));

            margin: 0 auto;

            padding: 40px 0 70px;

        }


        /* =========================================
           WELCOME
        ========================================= */

        .welcome-section {

            margin-bottom: 30px;

        }


        .welcome-section h2 {

            color:
                var(--maroon);

            font-size:
                clamp(
                    1.8rem,
                    3vw,
                    2.5rem
                );

        }


        .welcome-section p {

            color:
                var(--muted);

            margin-top: 5px;

        }


        /* =========================================
           STATS
        ========================================= */

        .dashboard-stats {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    1fr
                );

            gap: 20px;

            margin-bottom: 35px;

        }


        .dashboard-stat-card {

            background:
                var(--white);

            border:
                1px solid
                var(--border);

            border-radius: 18px;

            padding: 23px;

            box-shadow:
                var(--shadow);

        }


        .stat-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 14px;

        }


        .stat-title {

            color:
                var(--muted);

            font-size: 0.82rem;

            font-weight: 700;

        }


        .stat-icon {

            width: 42px;

            height: 42px;

            border-radius: 12px;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                var(--orange-light);

            font-size: 20px;

        }


        .stat-value {

            font-size: 1.7rem;

            font-weight: 900;

            color:
                var(--maroon);

        }


        /* =========================================
           CONTENT CARD
        ========================================= */

        .dashboard-card {

            background:
                var(--white);

            border:
                1px solid
                var(--border);

            border-radius: 20px;

            box-shadow:
                var(--shadow);

            overflow: hidden;

        }


        .dashboard-card-header {

            padding: 22px 25px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            border-bottom:
                1px solid
                var(--border);

        }


        .dashboard-card-header h3 {

            color:
                var(--maroon);

        }


        .refresh-button {

            border: none;

            background:
                var(--orange-light);

            color:
                var(--maroon);

            padding: 10px 15px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 700;

        }


        .refresh-button:hover {

            background:
                var(--orange);

            color: white;

        }


        /* =========================================
           TABLE
        ========================================= */

        .table-wrapper {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th {

            text-align: left;

            background:
                var(--cream-dark);

            color:
                var(--maroon);

            padding: 15px;

            font-size: 0.82rem;

        }


        td {

            padding: 15px;

            border-bottom:
                1px solid
                var(--border);

            color:
                var(--text);

            font-size: 0.88rem;

        }


        tr:hover {

            background:
                var(--orange-light);

        }


        .status {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 50px;

            font-size: 0.75rem;

            font-weight: 800;

            text-transform: uppercase;

        }


        .status-paid {

            background:
                rgba(
                    22,
                    140,
                    66,
                    0.12
                );

            color:
                #168c42;

        }


        .status-pending {

            background:
                rgba(
                    244,
                    123,
                    32,
                    0.15
                );

            color:
                var(--orange-dark);

        }


        .status-failed {

            background:
                rgba(
                    220,
                    53,
                    69,
                    0.10
                );

            color:
                #c82333;

        }


        /* =========================================
           ACTION BUTTONS
        ========================================= */

        .action-button {

            border: none;

            padding: 8px 12px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 0.78rem;

            font-weight: 700;

            margin-right: 5px;

        }


        .paid-button {

            background:
                var(--orange);

            color: white;

        }


        .delete-button {

            background:
                rgba(
                    220,
                    53,
                    69,
                    0.12
                );

            color:
                #c82333;

        }


        /* =========================================
           LOADING
        ========================================= */

        .dashboard-loading {

            padding: 50px;

            text-align: center;

            color:
                var(--muted);

        }


        .dashboard-error {

            padding: 20px;

            text-align: center;

            color:
                #c82333;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (
            max-width: 1000px
        ) {

            .dashboard-stats {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

            }

        }


        @media (
            max-width: 650px
        ) {

            .dashboard-nav {

                width:
                    min(
                        100% - 24px,
                        1280px
                    );

                flex-direction:
                    column;

                padding:
                    15px 0;

            }


            .dashboard-actions {

                width: 100%;

                justify-content:
                    space-between;

            }


            .dashboard-main {

                width:
                    min(
                        100% - 24px,
                        1280px
                    );

            }


            .dashboard-stats {

                grid-template-columns:
                    1fr;

            }


            .admin-user {

                max-width: 180px;

                overflow: hidden;

                white-space: nowrap;

                text-overflow:
                    ellipsis;

            }

        }


    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header
        class="dashboard-header"
    >


        <div
            class="dashboard-nav"
        >


            <div
                class="dashboard-brand"
            >


                <div
                    class="brand-icon"
                >

                    🛕

                </div>


                <div>

                    <h1>

                        Temple of Turki

                    </h1>


                    <p>

                        Admin Dashboard

                    </p>

                </div>


            </div>



            <div
                class="dashboard-actions"
            >


                <div
                    id="adminUser"
                    class="admin-user"
                >

                    Loading...

                </div>


                <button
                    id="logoutButton"
                    class="logout-button"
                >

                    Logout

                </button>


            </div>


        </div>


    </header>



    <!-- =========================================
         MAIN
    ========================================= -->

    <main
        class="dashboard-main"
    >


        <!-- WELCOME -->

        <section
            class="welcome-section"
        >

            <h2>

                Donation Dashboard

            </h2>


            <p>

                Manage and monitor Temple of Turki donations.

            </p>


        </section>



        <!-- STATS -->

        <section
            class="dashboard-stats"
        >


            <div
                class="dashboard-stat-card"
            >

                <div
                    class="stat-top"
                >

                    <span
                        class="stat-title"
                    >

                        Total Donations

                    </span>


                    <div
                        class="stat-icon"
                    >

                        🙏

                    </div>


                </div>


                <div
                    id="totalDonations"
                    class="stat-value"
                >

                    0

                </div>


            </div>



            <div
                class="dashboard-stat-card"
            >

                <div
                    class="stat-top"
                >

                    <span
                        class="stat-title"
                    >

                        Total Amount

                    </span>


                    <div
                        class="stat-icon"
                    >

                        ₹

                    </div>


                </div>


                <div
                    id="totalAmount"
                    class="stat-value"
                >

                    ₹0

                </div>


            </div>



            <div
                class="dashboard-stat-card"
            >

                <div
                    class="stat-top"
                >

                    <span
                        class="stat-title"
                    >

                        Paid Donations

                    </span>


                    <div
                        class="stat-icon"
                    >

                        ✓

                    </div>


                </div>


                <div
                    id="paidDonations"
                    class="stat-value"
                >

                    0

                </div>


            </div>



            <div
                class="dashboard-stat-card"
            >

                <div
                    class="stat-top"
                >

                    <span
                        class="stat-title"
                    >

                        Pending Donations

                    </span>


                    <div
                        class="stat-icon"
                    >

                        ⏳

                    </div>


                </div>


                <div
                    id="pendingDonations"
                    class="stat-value"
                >

                    0

                </div>


            </div>


        </section>



        <!-- DONATION TABLE -->

        <section
            class="dashboard-card"
        >


            <div
                class="dashboard-card-header"
            >


                <div>

                    <h3>

                        Recent Donations

                    </h3>


                </div>


                <button
                    id="refreshButton"
                    class="refresh-button"
                >

                    ↻ Refresh

                </button>


            </div>



            <div
                id="donationContent"
                class="table-wrapper"
            >

                <div
                    class="dashboard-loading"
                >

                    Loading donations...

                </div>


            </div>


        </section>


    </main>



    <!-- =========================================
         FIREBASE + DASHBOARD SCRIPT
    ========================================= -->

    <script type="module">


        import {
            auth
        }

        from "./firebase.js";


        import {

            onAuthStateChanged,

            signOut

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



        /* =========================================
           IMPORTANT

           Same admin email or Firebase UID as admin-login.html.
           Backend checks ADMIN_UIDS from .env as well.
        ========================================= */

        const ADMIN_EMAILS = [

            "dhirajkumar5566kl@gmail.com"

        ];

        const ADMIN_UIDS = [

           "YOUR_FIREBASE_UID_HERE"

        ];



        const adminUser =
            document.getElementById(
                "adminUser"
            );


        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        const refreshButton =
            document.getElementById(
                "refreshButton"
            );


        const donationContent =
            document.getElementById(
                "donationContent"
            );



        /* =========================================
           ADMIN CHECK
        ========================================= */

        function normalizeValue(
            value
        ) {

            return String(
                value || ""
            )
                .toLowerCase()
                .trim();

        }


        function isAuthorizedAdmin(
            user
        ) {


            if (!user) {

                return false;

            }


            const email =
                normalizeValue(
                    user.email
                );

            const uid =
                normalizeValue(
                    user.uid
                );


            const allowedEmails =
                ADMIN_EMAILS.map(
                    normalizeValue
                );

            const allowedUids =
                ADMIN_UIDS.map(
                    normalizeValue
                );


            return (
                allowedEmails.includes(
                    email
                ) ||
                allowedUids.includes(
                    uid
                )
            );

        }



        /* =========================================
           AUTH CHECK
        ========================================= */

        onAuthStateChanged(

            auth,

            async function (
                user
            ) {


                if (

                    !user ||

                    !isAuthorizedAdmin(
                        user
                    )

                ) {


                    if (
                        user
                    ) {

                        await signOut(
                            auth
                        );

                    }


                    window.location.href =
                        "admin-login.html";


                    return;

                }



                adminUser.textContent =
                    user.email;


                loadDonations();


            }

        );



        /* =========================================
           LOAD DONATIONS
        ========================================= */

        async function loadDonations() {


            try {


                donationContent.innerHTML = `

                    <div
                        class="dashboard-loading"
                    >

                        Loading donations...

                    </div>

                `;


                const user =
                    auth.currentUser;


                if (
                    !user
                ) {

                    throw new Error(
                        "Admin login required"
                    );

                }


                const token =
                    await
                    user.getIdToken();


                const response =
                    await fetch(

                        "/api/admin/donations",

                        {

                            headers: {

                                "Authorization":

                                    "Bearer " +
                                    token

                            }

                        }

                    );


                const result =
                    await
                    response.json();


                if (
                    !response.ok
                ) {

                    throw new Error(

                        result.message ||

                        "Failed to load donations"

                    );

                }


                const donations =
                    result.data || [];


                updateStats(
                    donations
                );


                renderDonations(
                    donations
                );


            }

            catch (
                error
            ) {


                console.error(
                    error
                );


                donationContent.innerHTML = `

                    <div
                        class="dashboard-error"
                    >

                        ${error.message}

                    </div>

                `;

            }


        }



        /* =========================================
           UPDATE STATS
        ========================================= */

        function updateStats(
            donations
        ) {


            const total =
                donations.length;


            const totalAmount =
                donations.reduce(

                    (
                        sum,
                        donation
                    ) =>

                        sum +
                        Number(
                            donation.amount || 0
                        ),

                    0

                );


            const paid =
                donations.filter(

                    donation =>

                        donation.status ===
                        "paid"

                ).length;


            const pending =
                donations.filter(

                    donation =>

                        donation.status ===
                        "pending"

                ).length;



            document
                .getElementById(
                    "totalDonations"
                )
                .textContent =
                    total;



            document
                .getElementById(
                    "totalAmount"
                )
                .textContent =

                    "₹" +

                    totalAmount
                        .toLocaleString(
                            "en-IN"
                        );



            document
                .getElementById(
                    "paidDonations"
                )
                .textContent =
                    paid;



            document
                .getElementById(
                    "pendingDonations"
                )
                .textContent =
                    pending;


        }



        /* =========================================
           RENDER DONATIONS
        ========================================= */

        function renderDonations(
            donations
        ) {


            if (
                donations.length === 0
            ) {


                donationContent.innerHTML = `

                    <div
                        class="dashboard-loading"
                    >

                        No donations found.

                    </div>

                `;


                return;

            }



            let html = `

                <table>

                    <thead>

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Mobile
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Purpose
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Date
                            </th>

                        </tr>

                    </thead>


                    <tbody>

            `;



            donations.forEach(

                donation => {


                    const date =
                        donation.createdAt

                            ?

                            new Date(
                                donation.createdAt
                            )
                            .toLocaleDateString(
                                "en-IN"
                            )

                            :

                            "-";



                    html += `

                        <tr>

                            <td>

                                ${donation.name || "-"}

                            </td>


                            <td>

                                ${donation.mobile || "-"}

                            </td>


                            <td>

                                ₹${Number(
                                    donation.amount || 0
                                ).toLocaleString(
                                    "en-IN"
                                )}

                            </td>


                            <td>

                                ${donation.purpose || "-"}

                            </td>


                            <td>

                                <span
                                    class="status status-${donation.status}"
                                >

                                    ${donation.status}

                                </span>

                            </td>


                            <td>

                                ${date}

                            </td>


                        </tr>

                    `;


                }

            );



            html += `

                    </tbody>

                </table>

            `;



            donationContent.innerHTML =
                html;


        }



        /* =========================================
           REFRESH
        ========================================= */

        refreshButton
            .addEventListener(

                "click",

                loadDonations

            );



        /* =========================================
           LOGOUT
        ========================================= */

        logoutButton
            .addEventListener(

                "click",

                async function () {


                    await
                    signOut(
                        auth
                    );


                    window.location.href =
                        "admin-login.html";


                }

            );


    </script>


</body>

</html>
